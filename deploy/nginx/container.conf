worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
map $uri $ovpncp_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/favicon\.svg$ "public, max-age=3600";
}

upstream ovpncp_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;

    add_header Cache-Control $ovpncp_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://login.microsoftonline.com; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy
        "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Exact match prevents a missing config from becoming the SPA fallback.
    # The server-level Cache-Control map marks this response no-store.
    location = /runtime-config.js {
        alias /tmp/ovpncp-runtime-config.js;
        default_type application/javascript;
        etag off;
        if_modified_since off;
    }

    location = /healthz {
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://ovpncp_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_hide_header Server;
    }

    location ^~ /api/ {
        proxy_pass http://ovpncp_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_hide_header Server;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
        access_log off;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri /index.html;
    }
}

}
