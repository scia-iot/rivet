[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovpncp"
version = "0.1.7"
license = { text = "Apache License 2.0" }
description = "OpenVPN Control Panel for Restricted Network."
authors = [{ name = "Nick Yao", email = "ipaddict@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    "cryptography",
    "pydantic>=2",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "PyYAML",
    "sqlmodel",
    "uvicorn",
    "python-jose[cryptography]",
]
security = ["ovpncp[api]"]
azure = [
    "ovpncp[api]",
    "azure-storage-blob"
]
mysql = [
    "mysql-connector-python"
]
postgres = [
    "psycopg2-binary"
]

[project.urls]
Homepage = "https://github.com/scia-iot"
Source = "https://github.com/scia-iot/ovpncp"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
ovpncp = "sciaiot.ovpncp.native_api:main"
ovpncp-vpn-event = "sciaiot.ovpncp.vpn_agent.event_hook:main"
ovpncp-vpn-agent = "sciaiot.ovpncp.vpn_agent.cli:main"
ovpncp-migrate = "sciaiot.ovpncp.migration.cli:main"
ovpncp-export-native = "sciaiot.ovpncp.native_assets:main"
ovpncp-native-firewall = "sciaiot.ovpncp.native_firewall:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "*tests.*",
    "*tests"
]

[tool.setuptools.package-data]
sciaiot = ["**/*.yml", "**/*.sh"]
"sciaiot.ovpncp.native_assets" = [
    "*.service", "*.conf", "*.example", "*.template", "*.sh"
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
