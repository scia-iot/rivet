[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciaiot-rivet"
# Release builds stamp this development placeholder from the GitHub tag.
version = "0.0.0.dev0"
license = { text = "Apache License 2.0" }
description = "Rivet: OpenVPN control plane from SCIA IoT."
authors = [{ name = "Nick Yao", email = "ipaddict@outlook.com" }]
requires-python = ">=3.14"
dependencies = [
    "cryptography",
    "pydantic>=2",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "PyYAML",
    "sqlmodel",
    "uvicorn",
    "python-jose[cryptography]",
]
security = ["sciaiot-rivet[api]"]
azure = [
    "sciaiot-rivet[api]",
    "azure-storage-blob"
]
mysql = [
    "mysql-connector-python"
]
postgres = [
    "psycopg2-binary"
]

[project.urls]
Homepage = "https://github.com/scia-iot"
Source = "https://github.com/scia-iot/ovpncp"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.scripts]
rivet = "sciaiot.rivet.native_api:main"
rivet-vpn-event = "sciaiot.rivet.vpn_agent.event_hook:main"
rivet-agent = "sciaiot.rivet.vpn_agent.cli:main"
rivet-migrate = "sciaiot.rivet.migration.cli:main"
rivet-export-native = "sciaiot.rivet.native_assets:main"
rivet-native-firewall = "sciaiot.rivet.native_firewall:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    "*tests.*",
    "*tests"
]

[tool.setuptools.package-data]
sciaiot = ["**/*.yml", "**/*.sh"]
"sciaiot.rivet.native_assets" = [
    "*.service", "*.conf", "*.example", "*.template", "*.sh"
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]

[tool.mypy]
exclude = ["^build/"]

[tool.ruff.per-file-target-version]
"tests/integration/vpn_container_rehearsal.py" = "py312"
"tests/integration/compose_phase6_rehearsal.py" = "py312"
"tests/integration/compose_phase6_host_rehearsal.py" = "py312"
"tests/integration/phase7_container_rehearsal.py" = "py312"
"deploy/containers/prepare_state.py" = "py312"
