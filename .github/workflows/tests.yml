# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: "Tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: [ "3.14" ]
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.15.0
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install SQLite
      run: |
        sudo apt update && sudo apt install sqlite3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Validate container artifacts without building or deploying
      env:
        OVPNCP_REGISTRY: example.invalid
        OVPNCP_PLATFORM: linux/amd64
        OVPNCP_UI_ENTRA_TENANT_ID: 00000000-0000-4000-8000-000000000000
        OVPNCP_UI_ENTRA_CLIENT_ID: 11111111-1111-4111-8111-111111111111
        OVPNCP_UI_ENTRA_API_SCOPE: api://22222222-2222-4222-8222-222222222222/access_as_user
        AZURE_ENTRAID_TENANT_ID: 00000000-0000-4000-8000-000000000000
        AZURE_ENTRAID_APP_CLIENT_ID: 22222222-2222-4222-8222-222222222222
        OVPNCP_AGENT_ROUTE_PROTOCOL: '200'
        OVPNCP_STATE_ROOT: /tmp/ovpncp-ci-unused
        OVPNCP_OPENVPN_IMAGE: example.invalid/openvpn@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        OVPNCP_AGENT_IMAGE: example.invalid/agent@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        OVPNCP_API_IMAGE: example.invalid/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        OVPNCP_WEB_IMAGE: example.invalid/web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      run: |
        docker compose -f deploy/compose.build.yml config --quiet
        docker compose -f deploy/compose.yml config --quiet
        pytest -q tests/test_container_images.py tests/test_container_compose.py tests/test_ui_runtime_config.py

    - name: Verify frontend and generated API contract
      working-directory: frontend
      run: |
        npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps=false
        npm audit
        npm run api:check
        npm run lint
        npm run typecheck
        npm run test
        npm run build
        npm run test:production
        npm run test:e2e:production-guard

    - name: Build deployable frontend
      working-directory: frontend
      env:
        VITE_API_BASE_URL: /api
        VITE_AUTH_DISABLED: "false"
        VITE_ENTRA_API_SCOPE: >-
          api://22222222-2222-4222-8222-222222222222/access_as_user
        VITE_ENTRA_CLIENT_ID: 11111111-1111-4111-8111-111111111111
        VITE_ENTRA_TENANT_ID: 00000000-0000-4000-8000-000000000000
      run: npm run build:production

    - name: Install Playwright browser
      working-directory: frontend
      run: npx playwright install --with-deps chromium

    - name: Run deterministic frontend E2E tests
      working-directory: frontend
      run: npm run test:e2e

    - name: Verify environment-independent UI container assets
      working-directory: frontend
      env:
        CI: 'true'
      run: npm run test:container

    - name: Lint with Ruff
      uses: astral-sh/ruff-action@v3

    - name: Type check with mypy
      run: |
        mypy .
        
    - name: Run tests
      run: |
        pytest --cov . --cov-report xml:coverage.xml
  
    - name: Get coverage
      uses: orgoro/coverage@v3.2
      with:
        coverageFile: coverage.xml
        token: ${{ secrets.GITHUB_TOKEN }}
