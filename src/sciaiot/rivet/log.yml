version: 1
disable_existing_loggers: False

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  json:
    (): sciaiot.rivet.utils.logging.JSONFormatter

handlers:
  console: 
    formatter: json
    class: logging.StreamHandler
    stream: ext://sys.stdout

  file:
    formatter: json
    class: logging.handlers.TimedRotatingFileHandler
    when: D
    backupCount: 0
    filename: /tmp/rivet.log

root:
  level: INFO
  handlers: [console, file]

loggers:
  uvicorn:
    level: INFO
    handlers: [console, file]
    propagate: False
